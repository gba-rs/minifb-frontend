[package]
name = "minifb-frontend"
version = "0.1.0"
authors = ["Eric Nowac <nowace@msoe.edu>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gba-emulator = {path = "../gba-emu"}
minifb = "0.28.0"
log = "0.4.34"
env_logger = "0.11.11"
# 0.17.0 fails to build on docs.rs (checked before bumping) — staying on 0.16
# until that's resolved upstream.
average = "0.16.0"
clap = { version = "4.6.6", features = ["derive"] }
gilrs = "0.11.2"
cpal = "0.15"
ringbuf = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
muda = "0.19.3"
rfd = "0.17.2"
raw-window-handle = "0.6"

[profile.release]
debug = true
lto = true
codegen-units = 1
